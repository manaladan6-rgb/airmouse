[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "14.0.0"
description = "AirMouse v10.0 Universal Offline Interaction Edition — everything from v9 plus: universal local event bus, offline voice engine (pluggable local ASR, VAD, command/dictation/hybrid modes), 75-command deterministic grammar, context engine, full gesture registry with custom mappings, RF-sensing abstraction, system/file action executors, local browser bridge with semantic control + verification, true offline mode, hands-free combos; plus — webcam eye/gaze tracking with dwell + blink control, 14-gesture hand mouse, 30-phrase voice + natural-language control, multimodal fusion engine (gaze x hand x voice), screen understanding, intent engine, verified action execution with recovery, safety system (e-stop, rate limits, confirmations), semantic macros, hybrid One Euro + Kalman filtering, adaptive calibration, and single-file simple mode"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "AirMouse"}]
keywords = ["airmouse", "hand-tracking", "gaze", "eye-tracking", "gesture", "mouse", "multimodal", "fusion", "voice-control", "natural-language", "screen-understanding", "intent-engine", "kalman-filter", "accessibility", "hands-free"]

dependencies = [
    "mediapipe>=0.10.9,<1.0",
    "opencv-python>=4.8.0",
    "pynput>=1.7.6",
    "numpy>=1.24.0,<2.3",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
sound = ["sounddevice>=0.5.0"]
voice = ["SpeechRecognition>=3.10.0", "pyaudio>=0.2.13"]
tts = ["pyttsx3>=2.90"]

[project.scripts]
airmouse = "airmouse.__main__:main"

[tool.setuptools.packages.find]
include = ["airmouse*"]

[tool.setuptools.package-data]
airmouse = ["browser_extension/*"]
