[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "1.0.4"
description = "Physics-driven webcam finger mouse — control your cursor with hand gestures using pure spring-damper physics"
readme = "README.txt"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "AirMouse"}]
keywords = ["airmouse", "hand-tracking", "gesture", "mouse", "physics", "mediapipe", "webcam"]

dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.0",
    "pynput>=1.7.6",
    "numpy>=1.24.0",
]

[project.scripts]
airmouse = "airmouse.__main__:main"

[tool.setuptools.packages.find]
include = ["airmouse*"]
