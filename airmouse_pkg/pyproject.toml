[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "19.0.3"
description = "AirMouse v15 — adaptive human-computer intelligence: hand/gaze/voice multimodal control with on-device personal intelligence, a permission-gated agent layer (AIP + Agent SDK), self-healing recovery, and guided setup/doctor/testing. Local-first, offline by default, no telemetry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "AirMouse"}]
keywords = ["airmouse", "hand-tracking", "gaze", "eye-tracking", "gesture", "mouse", "multimodal", "fusion", "voice-control", "natural-language", "screen-understanding", "intent-engine", "kalman-filter", "accessibility", "hands-free"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Adaptive Technologies",
    "Topic :: Human Computer Interaction",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mediapipe>=0.10.9,<1.0",
    "opencv-python>=4.8.0",
    "pynput>=1.7.6",
    "numpy>=1.24.0,<2.3",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
sound = ["sounddevice>=0.5.0"]
voice = ["SpeechRecognition>=3.10.0", "pyaudio>=0.2.13", "vosk>=1.16.0"]
tts = ["pyttsx3>=2.90"]

[project.urls]
Homepage = "https://github.com/manaladan6-rgb/airmouse"
Repository = "https://github.com/manaladan6-rgb/airmouse"
Issues = "https://github.com/manaladan6-rgb/airmouse/issues"
Changelog = "https://github.com/manaladan6-rgb/airmouse/blob/main/CHANGELOG.md"

[project.scripts]
airmouse = "airmouse.__main__:main"

[tool.setuptools.packages.find]
include = ["airmouse*"]

[tool.setuptools.package-data]
airmouse = ["browser_extension/*"]
