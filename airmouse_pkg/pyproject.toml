[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "2.1.1"
description = "AirMouse Iron Man Edition — physics-driven finger-relative mouse with gesture recognition, momentum throw, and adaptive spring-damper physics"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "AirMouse"}]
keywords = ["airmouse", "hand-tracking", "gesture", "mouse", "physics", "mediapipe", "iron-man"]

dependencies = [
    "mediapipe>=0.10.9",
    "opencv-python>=4.8.0",
    "pynput>=1.7.6",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
sound = ["sounddevice>=0.5.0"]

[project.scripts]
airmouse = "airmouse.__main__:main"

[tool.setuptools.packages.find]
include = ["airmouse*"]
